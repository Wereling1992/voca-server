[package]
name = "voca-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenAI-compatible HTTP server for sultson/voca (tiny-voca Rust)"
repository = "https://github.com/Wereling1992/voca-server"
readme = "README.md"

[[bin]]
name = "voca-server"
path = "src/main.rs"

[dependencies]
# Local dev: clone upstream next to this folder
#   git clone --depth 1 https://github.com/sultson/voca.git ../voca
# Docker build rewrites the path via sed.
tiny-voca = { path = "../voca/crates/tiny-voca", default-features = false }
axum = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
